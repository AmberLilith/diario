<div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <mat-icon class="auth-icon">menu_book</mat-icon>
          <h1>Diário</h1>
          <p>Autentique-se abaixo</p>
        </div>

        <mat-tab-group [selectedIndex]="selectedTab" animationDuration="200ms">

          <mat-tab label="Entrar">
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>E-mail</mat-label>
                <input #emailToLogIn matInput type="email" formControlName="email">
                <mat-icon matSuffix>email</mat-icon>
              </mat-form-field>

              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Senha</mat-label>
                <input #passToLogIn matInput [type]="showPass() ? 'text' : 'password'" formControlName="password">
                <button type="button" mat-icon-button matSuffix (click)="showPass.set(!showPass())">
                  <mat-icon>{{ showPass() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>

              <button
                type="submit"
                mat-flat-button
                color="primary"
                class="full-width submit-btn"
                [disabled]="loading() || loginForm.invalid">
                @if (loading()) { <mat-spinner diameter="20"></mat-spinner> }
                @else { Entrar }
              </button>
            </form>
          </mat-tab>

          <mat-tab label="Criar conta">
            <form [formGroup]="registerForm" (ngSubmit)="emailToLogIn.value = emailToRegister.value; passToLogIn.value = passToRegister.value;onRegister()" class="auth-form">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>E-mail</mat-label>
                <input #emailToRegister matInput type="email" formControlName="email" autocomplete="email" >
                <mat-icon matSuffix>email</mat-icon>
              </mat-form-field>

              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Senha</mat-label>
                <input #passToRegister matInput [type]="showPass() ? 'text' : 'password'" formControlName="password">
                <mat-hint>Mínimo 6 caracteres</mat-hint>
                <button type="button" mat-icon-button matSuffix (click)="showPass.set(!showPass())">
                  <mat-icon>{{ showPass() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>

              <button
                type="submit"
                mat-flat-button
                color="primary"
                class="full-width submit-btn"
                [disabled]="loading() || registerForm.invalid">
                @if (loading()) { <mat-spinner diameter="20"></mat-spinner> }
                @else { Criar conta }
              </button>
            </form>
          </mat-tab>

        </mat-tab-group>
      </div>
    </div>
