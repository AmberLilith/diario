 <div class="detail-container">

      @if (loading()) {
        <div class="loading-state">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else if (entry()) {

        <!-- Header -->
        <div class="detail-header">
          <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
          </button>
          <div class="header-actions">
            <button mat-stroked-button (click)="edit()">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
            <button mat-stroked-button color="warn" (click)="delete()">
              <mat-icon>delete</mat-icon>
              Excluir
            </button>
          </div>
        </div>

        <!-- Meta -->
        <div class="entry-meta">
          <span class="entry-date">
            <mat-icon class="meta-icon">calendar_today</mat-icon>
            {{ entry()!.created_at | date:'dd/MM/yyyy - HH:mm' }}
          </span>
          @if (entry()!.emotion) {
            <span
              class="emotion-badge"
              [style.background]="entry()!.emotion!.color + '22'"
              [style.border-color]="entry()!.emotion!.color"
              [style.color]="entry()!.emotion!.color">
              {{ entry()!.emotion!.emoji }} {{ entry()!.emotion!.label }}
            </span>
          }
        </div>

        <!-- Conteúdo -->
        <div
          class="entry-content"
          [innerHTML]="entry()!.content"
          (click)="onContentClick($event)">
        </div>

      }

    </div>
